<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>The Blue Book</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #111111; color: #f2f0eb;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      .card { text-align: center; max-width: 360px; padding: 24px; }
      svg { margin-bottom: 20px; }
      h1 { font-size: 15px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; margin: 0 0 10px; font-family: ui-monospace, Menlo, monospace; }
      p { color: #8a8a90; font-size: 13px; line-height: 1.6; margin: 0 0 20px; }
      button {
        background: #1a1a1c; color: #f2f0eb; border: 1px solid #2e2e34; border-radius: 4px;
        padding: 8px 18px; font-size: 13px; cursor: pointer;
      }
      button:hover { background: #303038; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg viewBox="0 0 24 32" width="36" height="48" aria-hidden="true">
        <path fill="#34507e" d="M3 0H21A3 3 0 0 1 24 3V29A3 3 0 0 1 21 32H19.6V14L17.3 17.4L15 14V32H3A3 3 0 0 1 0 29V3A3 3 0 0 1 3 0Z" />
      </svg>
      <h1>The Blue Book</h1>
      <p>Can't reach The Blue Book. Check your internet connection and try again.</p>
      <button id="retry">Try again</button>
    </div>
    <script>
      const target = new URLSearchParams(location.search).get("url");
      document.getElementById("retry").addEventListener("click", () => {
        if (target) location.href = target;
      });
      window.addEventListener("online", () => { if (target) location.href = target; });
    </script>
  </body>
</html>
